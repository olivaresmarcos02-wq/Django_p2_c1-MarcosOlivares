{% extends 'base.html' %}

{% block title %}Página no encontrada - EcoEnergy{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="alert alert-danger shadow-sm py-5 border-danger">
                <h1 class="display-1 fw-bold text-danger">404</h1>
                <h3 class="mb-4">¡Ups! Zona no encontrada</h3>
                <p class="lead mb-4">La zona de consumo que intentas revisar no existe en nuestros registros.</p>
                <!-- Usamos tu app_name 'dispositivos' para el botón de regreso -->
                <a href="{% url 'dispositivos:catalogo' %}" class="btn btn-outline-danger">
                    Volver a Zonas de Consumo
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
