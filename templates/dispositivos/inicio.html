<!-- templates/dispositivos/inicio.html -->
{% extends "base.html" %}


{% block content %}
<div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="row justify-content-center w-100">
        {% for item in info %}
            <div class="col-12 col-md-10 col-lg-8">
                <div class="card border-0 shadow-lg rounded-4 text-center">
                    <div class="card-body p-5">
                        <h1 class="display-4 fw-bold text-success mb-4">
                            {{ item.titulo }}
                        </h1>

                        <p class="lead text-muted mb-4">
                            {{ item.descripcion }}
                        </p>

                        <div class="d-inline-block px-4 py-2 bg-success bg-opacity-10 rounded-pill">
                            <span class="fw-semibold text-success">
                                {{ item.curso }}
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
